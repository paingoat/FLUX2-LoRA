---
job: extension
config:
  name: "removal_dual_4b"
  process:
    - type: sd_trainer
      training_folder: "/workspace/output"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 6
        push_to_hub: false
      datasets:
        - folder_path: "/workspace/datasets/removal_dual/target"
          control_path_1: "/workspace/datasets/removal_dual/original"
          control_path_2: "/workspace/datasets/removal_dual/reference"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512]
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 4
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        timestep_type: "weighted"
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "flux2_klein_4b"
        quantize_te: true
        model_kwargs:
          match_target_res: true
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 512
        height: 512
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 20
        samples:
          - prompt: &removal_prompt "Image 1 is the original image to edit. Image 2 is the same image with annotations indicating the edit. Use image 1 as the source and image 2 as spatial guidance. Do not reproduce the annotation strokes in the output. Preserve content outside the requested edit. Editing instruction: Remove the object inside the red circle and naturally restore the background."
            ctrl_img_1: "/workspace/datasets/removal_dual/sample_controls/0015_original.png"
            ctrl_img_2: "/workspace/datasets/removal_dual/sample_controls/0015.png"
          - prompt: *removal_prompt
            ctrl_img_1: "/workspace/datasets/removal_dual/sample_controls/0022_original.png"
            ctrl_img_2: "/workspace/datasets/removal_dual/sample_controls/0022.png"
          - prompt: *removal_prompt
            ctrl_img_1: "/workspace/datasets/removal_dual/sample_controls/0040_original.png"
            ctrl_img_2: "/workspace/datasets/removal_dual/sample_controls/0040.png"
          - prompt: *removal_prompt
            ctrl_img_1: "/workspace/datasets/removal_dual/sample_controls/0057_original.png"
            ctrl_img_2: "/workspace/datasets/removal_dual/sample_controls/0057.png"
meta:
  name: "[name]"
  version: "1.0"
